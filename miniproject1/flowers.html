<head>

    <title>Flower Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .body {
         background-color: #fffacdf1; 
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .word-button {
            display: inline-block;

        }

<body>
    <header class="header">
        <h1> All Occasions</h1> 
    
        <nav class="navbar">
            <ul class="nav-list">
               <h2> <botton><li><a href="360home.html"><strong>Home</strong></a></li></botton></strong></h2>
            </ul>
        </nav>
        
    </header>
<body>
    <div class="container">
        <div class="row" id="card-list">
            <!-- Cards will be dynamically added here -->
        </div>
    </div>

    <template id="card-template">
        <div class="col-md-4 col-sm-6 mb-4">
            <div class="card">
                <div id="" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="" class="card-img-top" alt="Flower Image 1">
                        </div>
                        <div class="carousel-item">
                            <img src="" class="card-img-top" alt="Flower Image 2">
                        </div>



                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                </div>
            </div>
        </div>
    </template>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
